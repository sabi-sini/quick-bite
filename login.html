<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="auth-wrap">
  <div class="auth-card">
    <span class="kicker">Welcome back</span>
    <h1>Login</h1>
    <div class="flash ok" th:if="${param.registered}">Account created — please log in.</div>
    <div class="flash error" th:if="${param.error}">Invalid email or password.</div>
    <form th:action="@{/login}" method="post" class="stack">
      <label>Email <input type="email" name="username" required></label>
      <label>Password <input type="password" name="password" required></label>
      <button class="btn btn-block">Login</button>
    </form>
    <p class="muted center">New to QuickBite? <a th:href="@{/register}">Create an account</a></p>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
