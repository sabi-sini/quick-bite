spring.application.name=quickbite
server.port=8080

# ---- MySQL (XAMPP defaults: user root, empty password) ----
spring.datasource.url=jdbc:mysql://localhost:3306/quickbite?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=

# Hibernate creates / updates the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
