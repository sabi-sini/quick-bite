<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign Up')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="auth-wrap">
  <div class="auth-card">
    <span class="kicker">Join QuickBite</span>
    <h1>Create Account</h1>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/register}" method="post" class="stack">
      <label>Name <input name="name" required></label>
      <label>Email <input type="email" name="email" required></label>
      <label>Password <input type="password" name="password" minlength="6" required></label>
      <label>Default address <input name="address" required></label>
      <button class="btn btn-block">Sign Up</button>
    </form>
    <p class="muted center">Already registered? <a th:href="@{/login}">Login</a></p>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
